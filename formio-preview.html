<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- Bootstrap SOLO dentro del iframe -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />

  <!-- Form.io -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/formiojs@latest/dist/formio.full.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/formiojs@latest/dist/formio.full.min.js"></script>

  <style>
    body {
      padding: 20px;
    }
  </style>
</head>

<body>

<div id="formio"></div>

<script>
  window.addEventListener("message", (event) => {

    const { schema, submission } = event.data;

    if (!schema) return;

    Formio.createForm(document.getElementById("formio"), schema).then((form) => {

      if (submission) {
        form.submission = submission;
      }

      form.on("change", (data) => {
        parent.postMessage(
          { type: "form-change", data: data.data },
          "*"
        );
      });

    });

  });
</script>

</body>
</html>
